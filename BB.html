<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>राधिका भास्कर – Complete Baby & Mother Care</title>

<style>

body{
font-family:'Noto Sans Devanagari',sans-serif;
background:linear-gradient(180deg,#fff,#eef6ff);
margin:0;padding:0;color:#333;
}

.container{max-width:720px;margin:auto;padding:15px;}

.hero{
background:linear-gradient(135deg,#ffd6e7,#d6e6ff);
padding:20px;border-radius:20px;text-align:center;
}

.card{
background:#fff;border-radius:14px;
padding:16px;margin-top:16px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.progress{height:18px;background:#eee;border-radius:10px;overflow:hidden;}
.bar{height:100%;background:linear-gradient(90deg,#ff6ec4,#7873f5);color:#fff;text-align:center;font-size:12px;}

textarea{
width:100%;height:80px;border-radius:10px;padding:10px;
border:1px solid #ccc;
}

h3{color:#7b1b5a;margin-bottom:6px;}

</style>
</head>

<body>

<div class="container">

<div class="hero">
<h1>👨‍👩‍👧 The Bhasker Family</h1>
<h2>👶 राधिका भास्कर</h2>
<p>जन्म: 05 अप्रैल 2026</p>
</div>

<div class="card" id="age"></div>
<div class="card" id="baby"></div>
<div class="card" id="mother"></div>
<div class="card" id="vaccine"></div>
<div class="card" id="sleep"></div>
<div class="card" id="brain"></div>
<div class="card" id="hygiene"></div>
<div class="card" id="warning"></div>
<div class="card" id="routine"></div>

<div class="card">
<h3>📝 नोट्स (आप लिख सकते हैं)</h3>
<textarea placeholder="यहाँ अपनी नोट्स लिखें..."></textarea>
</div>

</div>

<script>

const birthDate = new Date("2026-04-05");

function update(){

const now = new Date();

let totalDays = Math.floor((now - birthDate)/(1000*60*60*24));

let years = Math.floor(totalDays/365);
let months = Math.floor((totalDays%365)/30);
let days = totalDays % 30;

let progress = Math.min(100,Math.floor((totalDays/730)*100));

// 👶 Baby
let babyText="",babyFood="";

if(totalDays<30){
babyText="👶 नवजात – सोना, दूध पीना और रोना";
babyFood="🍼 हर 2-3 घंटे स्तनपान";
}
else if(totalDays<180){
babyText="😊 मुस्कुराना, गर्दन पकड़ना";
babyFood="🍼 केवल माँ का दूध";
}
else if(totalDays<365){
babyText="🚼 बैठना, रेंगना, खड़ा होना";
babyFood="🍌 केला, खिचड़ी, दाल, सूजी";
}
else{
babyText="🚶 चलना, बोलना शुरू";
babyFood="🍛 घर का खाना (कम मसाले)";
}

// 🤱 Mother
let motherFood="दूध, दाल, फल, सब्जी, मेवे";
let motherCare="आराम, पानी ज्यादा, तनाव कम";

// 💉 Vaccine
let vaccine="BCG, OPV, Hep B (जन्म)";
if(totalDays>42) vaccine="6,10,14 सप्ताह टीके";
if(totalDays>180) vaccine="6 माह Flu";
if(totalDays>270) vaccine="9 माह Measles";

// 💤 Sleep
let sleep="16-18 घंटे";
if(totalDays>90) sleep="14-16 घंटे";
if(totalDays>180) sleep="12-14 घंटे";

// 🧠 Brain
let brain="बच्चे से बात करें, गाने सुनाएं, eye contact करें";

// 🧼 Hygiene
let hygiene="हाथ साफ रखें, कपड़े साफ, नहलाना जरूरी";

// ⚠️ Warning
let warning="बुखार, दूध न पीना, सुस्ती → डॉक्टर दिखाएँ";

// 🔔 Routine
let routine="दूध, नींद, सफाई, प्यार";

document.getElementById("age").innerHTML=`
<h3>🍼 उम्र</h3>
<p><b>${years} साल ${months} महीने ${days} दिन</b></p>
<p>📅 कुल दिन: ${totalDays}</p>
<div class="progress"><div class="bar" style="width:${progress}%">${progress}%</div></div>
`;

document.getElementById("baby").innerHTML=`
<h3>👶 बेबी</h3>
<p>${babyText}</p>
<p>${babyFood}</p>
`;

document.getElementById("mother").innerHTML=`
<h3>🤱 माँ</h3>
<p>🍲 ${motherFood}</p>
<p>💡 ${motherCare}</p>
`;

document.getElementById("vaccine").innerHTML=`
<h3>💉 टीकाकरण</h3><p>${vaccine}</p>
`;

document.getElementById("sleep").innerHTML=`
<h3>💤 नींद</h3><p>${sleep}</p>
`;

document.getElementById("brain").innerHTML=`
<h3>🧠 दिमाग विकास</h3><p>${brain}</p>
`;

document.getElementById("hygiene").innerHTML=`
<h3>🧼 सफाई</h3><p>${hygiene}</p>
`;

document.getElementById("warning").innerHTML=`
<h3>⚠️ सावधानी</h3><p>${warning}</p>
`;

document.getElementById("routine").innerHTML=`
<h3>🔔 दिनचर्या</h3><p>${routine}</p>
`;

}

update();
setInterval(update,60000);

</script>

</body>
</html>
