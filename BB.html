<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>राधिका भास्कर – बेबी ग्रोथ ट्रैकर</title>

  <style>
    body{
      font-family:'Noto Sans Devanagari',sans-serif;
      background:linear-gradient(180deg,#fffefd,#f6fbff);
      margin:0;padding:0;line-height:1.6;color:#333;
    }
    .container{max-width:650px;margin:auto;padding:16px;}
    .baby-hero{
      background:linear-gradient(135deg,#ffe6f0,#e6f0ff);
      padding:18px;border-radius:20px;text-align:center;
    }
    .card{
      background:#fff;border-radius:14px;padding:16px;margin-top:18px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }
    .progress{
      height:18px;border-radius:10px;background:#f3f4f6;
      overflow:hidden;margin:12px 0;
    }
    .progress-bar{
      height:100%;
      background:linear-gradient(90deg,#f472b6,#60a5fa);
      text-align:center;color:#fff;font-size:0.8rem;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="baby-hero">
    <h1>👨‍👩‍👧 The Bhasker Family</h1>
    <h2>👶 राधिका भास्कर</h2>
    <p>जन्म तिथि: 05 अप्रैल 2026</p>
  </div>

  <div class="card" id="age"></div>
  <div class="card" id="growth"></div>
  <div class="card" id="food"></div>

</div>

<script>

const birthDate = new Date("2026-04-05");

function updateBaby(){

  const now = new Date();

  let months = now.getMonth() - birthDate.getMonth() + 
               (12 * (now.getFullYear() - birthDate.getFullYear()));

  let days = now.getDate() - birthDate.getDate();

  if (days < 0) {
    months -= 1;
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    days += prevMonth;
  }

  let percent = Math.min(100, Math.floor((months/12)*100));

  // 👶 Growth + Food Logic
  let growth = "";
  let food = "";

  if(months < 1){
    growth = "बच्चा ज्यादातर सोता है, रोकर अपनी जरूरत बताता है।";
    food = "केवल माँ का दूध (Breastfeeding) – हर 2-3 घंटे में।";
  }
  else if(months < 3){
    growth = "मुस्कुराना शुरू करता है, आवाज पहचानने लगता है।";
    food = "सिर्फ माँ का दूध (कोई पानी/खाना नहीं)।";
  }
  else if(months < 6){
    growth = "गर्दन संभालना शुरू करता है, हाथ-पैर चलाता है।";
    food = "केवल स्तनपान (Exclusive Breastfeeding)।";
  }
  else if(months < 8){
    growth = "बैठने की कोशिश करता है।";
    food = "दाल पानी, चावल का पानी, मैश्ड केला, खिचड़ी।";
  }
  else if(months < 10){
    growth = "रेंगना (crawling) शुरू करता है।";
    food = "सूजी, दलिया, उबली सब्जी मैश करके।";
  }
  else if(months < 12){
    growth = "खड़ा होने की कोशिश करता है।";
    food = "नरम रोटी, दाल, चावल, फल, सब्जियाँ।";
  }
  else{
    growth = "चलना शुरू कर सकता है, बोलने की कोशिश करता है।";
    food = "घर का सामान्य खाना (कम मसाले वाला)।";
  }

  document.getElementById("age").innerHTML = `
    <h3>🍼 बेबी की उम्र</h3>
    <p><strong>${months} महीने ${days} दिन</strong></p>

    <div class="progress">
      <div class="progress-bar" style="width:${percent}%">
        ${percent}%
      </div>
    </div>
  `;

  document.getElementById("growth").innerHTML = `
    <h3>👣 विकास (Growth)</h3>
    <p>${growth}</p>
  `;

  document.getElementById("food").innerHTML = `
    <h3>🍎 इस समय क्या खिलाएं</h3>
    <p>${food}</p>
  `;
}

updateBaby();
setInterval(updateBaby,60000);

</script>

</body>
</html>
