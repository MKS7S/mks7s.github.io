<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>राधिका भास्कर – Baby Care ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --pink:    #ff6b9d;
  --purple:  #a855f7;
  --blue:    #60a5fa;
  --mint:    #34d399;
  --yellow:  #fbbf24;
  --orange:  #fb923c;
  --soft-bg: #fff8fb;
}

*{box-sizing:border-box;margin:0;padding:0;}

body {
  font-family: 'Noto Sans Devanagari', sans-serif;
  background: var(--soft-bg);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ── Floating Background Particles ── */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  border-radius: 50%;
  animation: floatUp linear infinite;
  opacity: 0.18;
}
@keyframes floatUp {
  0%   { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity:0; }
  10%  { opacity: 0.18; }
  90%  { opacity: 0.12; }
  100% { transform: translateY(-120px) rotate(360deg) scale(1.2); opacity:0; }
}

/* ── Main Container ── */
.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 14px 40px;
  position: relative;
  z-index: 1;
}

/* ── Hero Header ── */
.hero {
  background: linear-gradient(135deg, #ff6b9d, #a855f7, #60a5fa);
  border-radius: 28px;
  padding: 28px 20px 22px;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
  animation: heroIn 0.9s cubic-bezier(.17,.67,.41,1.3) both;
  box-shadow: 0 16px 48px rgba(168,85,247,0.35);
}
@keyframes heroIn {
  from { transform: translateY(-40px) scale(0.92); opacity:0; }
  to   { transform: translateY(0) scale(1); opacity:1; }
}
.hero::before {
  content:'';
  position:absolute;
  inset:-30px;
  background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.18) 0%, transparent 60%);
  pointer-events:none;
}
.hero-emoji {
  font-size: 60px;
  display: block;
  animation: babyBounce 2.4s ease-in-out infinite;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,0.18));
}
@keyframes babyBounce {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50%      { transform: translateY(-10px) rotate(3deg); }
}
.hero h1 {
  font-family: 'Baloo 2', sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin: 6px 0 2px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.18);
}
.hero h2 {
  font-size: 15px;
  font-weight: 400;
  opacity: 0.92;
}
.hero-dob {
  display: inline-block;
  background: rgba(255,255,255,0.22);
  border-radius: 20px;
  padding: 4px 16px;
  margin-top: 8px;
  font-size: 13px;
  backdrop-filter: blur(6px);
}

/* ── Age Badge ── */
.age-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(135deg, #fff0f9, #f5f0ff);
  border-radius: 20px;
  padding: 14px 18px;
  margin-top: 14px;
  border: 2px solid rgba(168,85,247,0.12);
  box-shadow: 0 4px 20px rgba(168,85,247,0.1);
  animation: cardIn 0.7s ease both;
  animation-delay: 0.15s;
}
.age-number {
  font-family: 'Baloo 2', sans-serif;
  font-size: 36px;
  font-weight: 800;
  background: linear-gradient(135deg, #ff6b9d, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.age-label { font-size: 13px; color: #888; }
.age-main  { font-size: 16px; font-weight: 700; color: #5b21b6; }

/* ── Phase Banner ── */
.phase-banner {
  background: linear-gradient(135deg, #fde68a, #fb923c);
  border-radius: 16px;
  padding: 10px 18px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 6px 20px rgba(251,146,60,0.28);
  animation: cardIn 0.7s ease both;
  animation-delay: 0.25s;
}
.phase-banner .phase-icon { font-size: 24px; animation: spin 3s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* ── Progress Ring ── */
.progress-wrap {
  background: #fff;
  border-radius: 20px;
  padding: 16px 18px;
  margin-top: 12px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.07);
  animation: cardIn 0.7s ease both;
  animation-delay: 0.3s;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #888;
  margin-bottom: 8px;
}
.progress-label span:last-child { font-weight: 700; color: #a855f7; }
.progress-track {
  height: 14px;
  background: #f3e8ff;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff6b9d, #a855f7, #60a5fa);
  border-radius: 10px;
  transition: width 1.8s cubic-bezier(.22,.68,0,1.2);
  width: 0%;
  position: relative;
}
.progress-fill::after {
  content: '';
  position: absolute;
  right: -3px; top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px;
  background: #fff;
  border: 3px solid #a855f7;
  border-radius: 50%;
  box-shadow: 0 2px 8px rgba(168,85,247,0.4);
}
.milestones-row {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
}
.milestone-dot {
  text-align: center;
  font-size: 11px;
  color: #bbb;
}
.milestone-dot.done { color: #a855f7; font-weight: 700; }
.milestone-dot span { display: block; font-size: 15px; }

/* ── Cards Grid ── */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}
.cards-grid .card-full { grid-column: 1 / -1; }

/* ── Card Base ── */
.card {
  border-radius: 20px;
  padding: 16px 15px;
  position: relative;
  overflow: hidden;
  animation: cardIn 0.7s ease both;
  cursor: default;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.card:hover {
  transform: translateY(-4px) scale(1.015);
  box-shadow: 0 12px 36px rgba(0,0,0,0.14) !important;
}
@keyframes cardIn {
  from { transform: translateY(24px) scale(0.96); opacity:0; }
  to   { transform: translateY(0) scale(1); opacity:1; }
}
.card::before {
  content:'';
  position:absolute;
  top:-20px; right:-20px;
  width:80px; height:80px;
  border-radius:50%;
  background: rgba(255,255,255,0.15);
  pointer-events:none;
}
.card-title {
  font-family: 'Baloo 2', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}
.card-title .ci {
  font-size: 20px;
  animation: wiggle 2.5s ease-in-out infinite;
}
@keyframes wiggle {
  0%,90%,100% { transform: rotate(0); }
  92%          { transform: rotate(-12deg); }
  96%          { transform: rotate(10deg); }
}
.card-body { color: rgba(255,255,255,0.95); font-size: 13px; line-height: 1.65; }
.card-body strong { color: #fff; font-weight: 700; }
.tag {
  display: inline-block;
  background: rgba(255,255,255,0.22);
  border-radius: 8px;
  padding: 2px 8px;
  font-size: 11.5px;
  margin: 2px 2px 0 0;
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.3);
}

/* ── Color themes per card ── */
.c-pink   { background: linear-gradient(135deg,#ff6b9d,#f472b6); box-shadow: 0 6px 24px rgba(255,107,157,0.3); }
.c-purple { background: linear-gradient(135deg,#a855f7,#8b5cf6); box-shadow: 0 6px 24px rgba(168,85,247,0.3); }
.c-blue   { background: linear-gradient(135deg,#3b82f6,#60a5fa); box-shadow: 0 6px 24px rgba(96,165,250,0.3); }
.c-mint   { background: linear-gradient(135deg,#10b981,#34d399); box-shadow: 0 6px 24px rgba(52,211,153,0.3); }
.c-yellow { background: linear-gradient(135deg,#f59e0b,#fbbf24); box-shadow: 0 6px 24px rgba(251,191,36,0.3); }
.c-orange { background: linear-gradient(135deg,#f97316,#fb923c); box-shadow: 0 6px 24px rgba(249,115,22,0.3); }
.c-red    { background: linear-gradient(135deg,#ef4444,#f87171); box-shadow: 0 6px 24px rgba(239,68,68,0.3); }
.c-teal   { background: linear-gradient(135deg,#0d9488,#2dd4bf); box-shadow: 0 6px 24px rgba(13,148,136,0.3); }
.c-indigo { background: linear-gradient(135deg,#6366f1,#818cf8); box-shadow: 0 6px 24px rgba(99,102,241,0.3); }
.c-rose   { background: linear-gradient(135deg,#e11d48,#fb7185); box-shadow: 0 6px 24px rgba(225,29,72,0.3); }
.c-brain  { background: linear-gradient(135deg,#7c3aed,#2563eb,#0891b2); box-shadow: 0 6px 28px rgba(124,58,237,0.4); }
.c-emotion{ background: linear-gradient(135deg,#db2777,#9333ea,#7c3aed); box-shadow: 0 6px 24px rgba(219,39,119,0.35); }

/* ── Brain card special glow ── */
.card.c-brain {
  border: 2px solid rgba(255,255,255,0.2);
  animation: cardIn 0.7s ease both, brainPulse 4s ease-in-out infinite;
}
@keyframes brainPulse {
  0%,100% { box-shadow: 0 6px 28px rgba(124,58,237,0.4); }
  50%      { box-shadow: 0 8px 40px rgba(37,99,235,0.6), 0 0 20px rgba(124,58,237,0.3); }
}

/* ── IQ tip box ── */
.iq-tip {
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 7px 10px;
  margin: 4px 0;
  font-size: 12.5px;
  border-left: 3px solid rgba(255,255,255,0.5);
  backdrop-filter: blur(4px);
}
.iq-science {
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 8px 12px;
  margin: 8px 0 4px;
  font-size: 12px;
  font-style: italic;
  border: 1px solid rgba(255,255,255,0.35);
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.iq-avoid {
  background: rgba(255,100,100,0.2);
  border-radius: 8px;
  padding: 6px 10px;
  margin-top: 6px;
  font-size: 12px;
  border-left: 3px solid rgba(255,160,160,0.7);
}

/* ── Divider within card ── */
.cdivider {
  border:none;
  border-top: 1px solid rgba(255,255,255,0.25);
  margin: 8px 0;
}

/* ── Clock strip ── */
.clock-strip {
  text-align: center;
  padding: 8px;
  color: #c084fc;
  font-size: 13px;
  font-family: 'Baloo 2', monospace;
  letter-spacing: 1px;
  margin-top: 4px;
}
#live-clock { font-size: 22px; font-weight: 800; color: #7c3aed; }

/* ── Footer ── */
.footer {
  text-align: center;
  margin-top: 28px;
  color: #c4b5fd;
  font-size: 12px;
}
.footer .heart { animation: heartbeat 1.2s ease infinite; display:inline-block; }
@keyframes heartbeat {
  0%,100%{ transform:scale(1); }
  50%    { transform:scale(1.3); }
}

/* ── Stagger delays ── */
.d1{animation-delay:.1s} .d2{animation-delay:.2s} .d3{animation-delay:.3s}
.d4{animation-delay:.4s} .d5{animation-delay:.5s} .d6{animation-delay:.6s}
.d7{animation-delay:.7s} .d8{animation-delay:.8s} .d9{animation-delay:.9s}
.d10{animation-delay:1s} .d11{animation-delay:1.1s} .d12{animation-delay:1.2s}

/* ── Sparkle ── */
.sparkle-row { display:flex; justify-content:center; gap:14px; margin-top:10px; }
.sparkle {
  font-size: 18px;
  animation: sparkleAnim 1.8s ease-in-out infinite;
}
.sparkle:nth-child(2){ animation-delay:.3s; }
.sparkle:nth-child(3){ animation-delay:.6s; }
.sparkle:nth-child(4){ animation-delay:.9s; }
.sparkle:nth-child(5){ animation-delay:1.2s; }
@keyframes sparkleAnim {
  0%,100% { transform:scale(1) rotate(0deg); opacity:.7; }
  50%      { transform:scale(1.4) rotate(20deg); opacity:1; }
}

/* ── Checklist ── */
.checklist { list-style:none; padding:0; margin:4px 0 0; }
.checklist li { padding:2px 0; display:flex; gap:6px; align-items:flex-start; }
.checklist li::before { content:'✓'; opacity:.7; flex-shrink:0; }
</style>
</head>
<body>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<div class="container">

  <!-- Hero -->
  <div class="hero">
    <span class="hero-emoji">👶</span>
    <h1>राधिका भास्कर</h1>
    <h2>The Bhasker Family 👨‍👩‍👧</h2>
    <div class="hero-dob">🎂 जन्म: 05 अप्रैल 2026</div>
    <div class="sparkle-row">
      <span class="sparkle">✨</span><span class="sparkle">🌸</span>

  <div class="clock-strip">
    <div id="live-clock">00:00:00</div>

  <div class="age-badge d1">
    <div>
      <div class="age-number" id="age-days">0</div>

    </div>
    <div style="flex:1">
      <div class="age-main" id="age-text">--</div>
      <div class="age-label" style="margin-top:3px" id="phase-text">--</div>

  </div>

  <!-- Progress Bar -->
  <div class="progress-wrap d3">
    <div class="progress-label">
      <span>📈 2 साल तक की यात्रा</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill"></div>
    </div>
    <div class="milestones-row">
      <div class="milestone-dot" id="m0"><span>🌱</span>जन्म</div>
      <div class="milestone-dot" id="m3"><span>😊</span>3 माह</div>
      <div class="milestone-dot" id="m6"><span>🍎</span>6 माह</div>
      <div class="milestone-dot" id="m12"><span>🚶</span>1 साल</div>

  </div>

  <!-- Cards Grid -->
  <div class="cards-grid">

    <!-- Baby Development -->
    <div class="card c-pink card-full d4" id="card-baby"></div>

    <!-- Food -->

    <!-- Sleep -->
    <div class="card c-indigo d5" id="card-sleep"></div>

    <!-- Mother Care -->
    <div class="card c-mint card-full d6" id="card-mother"></div>

    <!-- Vaccine -->
    <div class="card c-blue d7" id="card-vaccine"></div>

    <!-- Massage -->
    <div class="card c-yellow d7" id="card-massage"></div>

    <!-- 🧠 IQ & Brain Development (NEW) -->
    <div class="card c-brain card-full d8" id="card-iq"></div>

    <!-- Emotional Development (NEW) -->
    <div class="card c-emotion card-full d9" id="card-emotional"></div>

    <!-- Brain Dev (old card, now focused on activities) -->
    <div class="card c-purple card-full d8" id="card-brain"></div>

    <!-- Activities -->
    <div class="card c-teal d8" id="card-activity"></div>

    <!-- Hygiene -->
    <div class="card c-mint d9" id="card-hygiene"></div>

    <!-- Warning -->
    <div class="card c-red card-full d9" id="card-warning"></div>

    <!-- Routine -->
    <div class="card c-rose card-full d10" id="card-routine"></div>

  </div>

  <div class="footer">
    बनाया गया <span class="heart">❤️</span> से — राधिका के लिए
  </div>

</div>

<script>
// ── Particles ──
(function(){
  const c = document.getElementById('particles');
  const colors = ['#ff6b9d','#a855f7','#60a5fa','#34d399','#fbbf24','#fb923c'];
  const emojis = ['⭐','🌸','✨','💫','🎀','🌟','💗','🍼'];
  for(let i=0;i<22;i++){
    const el = document.createElement('div');
    const useEmoji = Math.random()>0.5;
    if(useEmoji){
      el.style.cssText = `position:absolute;font-size:${14+Math.random()*18}px;
        left:${Math.random()*100}%;bottom:-40px;
        animation:floatUp ${6+Math.random()*10}s linear infinite;
        animation-delay:${Math.random()*10}s;opacity:0;`;
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    } else {
      const size = 8 + Math.random()*20;
      el.className='particle';
      el.style.cssText=`width:${size}px;height:${size}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        left:${Math.random()*100}%;bottom:-40px;
        animation-duration:${7+Math.random()*12}s;
        animation-delay:${Math.random()*12}s;`;
    }
    c.appendChild(el);
  }
})();

// ── Live Clock ──
function updateClock(){
  const now = new Date();
  document.getElementById('live-clock').textContent =
    now.toLocaleTimeString('hi-IN',{hour12:false});
  const days=['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
  const months=['जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
  document.getElementById('live-date').textContent =
    `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
}
setInterval(updateClock,1000);
updateClock();

// ── Main Data ──
const BIRTH = new Date("2026-04-05");

function getPhaseData(d){
  // d = total days since birth

  if(d < 7) return {
    phase:'🌅 नवजात – पहला सप्ताह',
    icon:'🌅', emoji:'👼',
    baby:{
      title:'नवजात शिशु – पहले 7 दिन',
      points:[

        'आँखें अभी धुंधली हैं – 20-30 cm दूर की चीज़ें देखती है',
        'Moro reflex (चौंकना), sucking reflex (चूसना) सक्रिय है',
        'नाभि का ध्यान रखें – सूखी और साफ रखें',
        'पीला रंग (jaundice) दिखे तो डॉक्टर से मिलें',
      ]
    },
    food:{
      title:'पहला आहार',
      lines:[
        '🤱 हर 2-3 घंटे स्तनपान (24 घंटे में 8-12 बार)',
        '🥛 पहला दूध (colostrum) बहुत ज़रूरी है',
        '💧 पानी, शहद, घुट्टी – बिल्कुल नहीं',
        '⚠️ Formula केवल डॉक्टर की सलाह पर',
      ]
    },
    sleep:'16-18 घंटे, हर 2-3 घंटे जागना सामान्य है',
    motherFood:'दाल, चावल, घी, हल्दी वाला दूध, मेथी के लड्डू',
    motherCare:'आराम सबसे ज़रूरी, टाँके का ध्यान रखें, कोई भारी काम नहीं',
    vaccine:'जन्म के समय: BCG, OPV-0, Hep-B पहली खुराक',
    massage:'अभी मालिश न करें – त्वचा बहुत नाज़ुक है। गर्म तेल से हल्का स्पर्श काफी है',

function update(){
  const now   = new Date();
  const total = Math.floor((now - BIRTH) / 86400000);
  const years = Math.floor(total / 365);
  const months= Math.floor((total % 365) / 30);
  const days  = total % 30;
  const pct   = Math.min(100, Math.floor((total / 730) * 100));

  const p = getPhaseData(total);

  // Age badge
  document.getElementById('age-days').textContent = total;
  document.getElementById('age-text').textContent =
    `${years > 0 ? years + ' साल ' : ''}${months > 0 ? months + ' महीने ' : ''}${days} दिन`;
  document.getElementById('phase-text').textContent = p.phase;
  document.getElementById('age-emoji').textContent  = p.ageEmoji;

  // Phase banner
  document.getElementById('phase-icon').textContent = p.icon;
  document.getElementById('phase-name').textContent = p.phase;

  // Progress
  document.getElementById('prog-pct').textContent = pct + '%';
  setTimeout(() => {
    document.getElementById('prog-fill').style.width = pct + '%';
  }, 400);

  // Milestone dots
  [[0,'m0'],[90,'m3'],[180,'m6'],[365,'m12'],[730,'m24']].forEach(([d,id]) => {
    if(total >= d) document.getElementById(id)?.classList.add('done');
  });

  // ── Cards ──
  set('card-baby', '👶', 'बेबी का विकास', p.baby.title,
    `<ul class="checklist">${p.baby.points.map(x=>`<li>${x}</li>`).join('')}</ul>`);

  set('card-food', '🍎', 'आहार', p.food.title,
    p.food.lines.map(x=>`<div class="tag" style="display:block;margin:3px 0">${x}</div>`).join(''));

  set('card-sleep', '💤', 'नींद', 'नींद की ज़रूरत',
    `<div style="font-size:28px;text-align:center;margin:6px 0">😴</div>
     <div>${p.sleep}</div>`);

  set('card-mother', '🤱', 'माँ की देखभाल', 'माँ का खाना-पीना',
    `<div class="tag">🍲 ${p.motherFood}</div>
     <hr class="cdivider">
     <strong>💡 देखभाल:</strong><div style="margin-top:4px">${p.motherCare}</div>`);

  set('card-vaccine', '💉', 'टीकाकरण', 'इस समय के टीके',
    `<div style="white-space:pre-line;line-height:1.8">${p.vaccine}</div>`);

  set('card-massage', '🌿', 'मालिश', 'आज की मालिश',
    `<div>${p.massage}</div>`);

  // ── NEW: IQ Card ──
  const iqTipsHTML = p.iq.tips.map(t =>
    `<div class="iq-tip">${t}</div>`
  ).join('');
  set('card-iq', '🧠', 'IQ & Brain Development', p.iq.title,
    `<div class="iq-science">🔬 <span>${p.iq.science.replace('🔬 ','')}</span></div>
     <strong style="font-size:13px">💡 आज क्या करें:</strong>
     <div style="margin-top:5px">${iqTipsHTML}</div>
     <div class="iq-avoid">${p.iq.avoid}</div>`);

  // ── NEW: Emotional Development Card ──
  const emoTipsHTML = p.emotional.tips.map(t =>
    `<div class="iq-tip">${t}</div>`
  ).join('');
  set('card-emotional', '💗', 'भावनात्मक विकास (EQ)', p.emotional.title,
    `<div style="margin-top:4px">${emoTipsHTML}</div>`);

  set('card-brain', '🎮', 'खेल-गतिविधियाँ', 'दिमाग बढ़ाएँ',
    `<div>${p.brain}</div>
     <hr class="cdivider">
     <strong>🎮 गतिविधियाँ:</strong>
     <div style="margin-top:4px">${p.activity}</div>`);

  set('card-activity', '🎯', 'आज क्या खेलें?', 'Activities',
    `<div>${p.activity}</div>`);

  set('card-hygiene', '🧼', 'सफाई', 'स्वच्छता',
    `<div>${p.hygiene}</div>`);

  set('card-warning', '⚠️', 'सावधानी', 'ये लक्षण दिखें तो डॉक्टर को दिखाएँ',
    `<div style="font-size:13.5px;line-height:1.8">${p.warning}</div>`);

  set('card-routine', '🔔', 'दिनचर्या', 'आज का रूटीन',
    `<div style="line-height:1.9">${p.routine}</div>`);
}

function set(id, icon, title, subtitle, body){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = `
    <div class="card-title">
      <span class="ci">${icon}</span> ${title}
    </div>
    <div class="card-body">
      <strong>${subtitle}</strong><hr class="cdivider">
      ${body}
    </div>`;
}

update();
setInterval(update, 60000);
</script>
</body>
</html>
